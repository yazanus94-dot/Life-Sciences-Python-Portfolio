<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Arial, Helvetica, sans-serif">
  <style>
    .title{font:700 18px sans-serif; fill:#0f172a}
    .sub{font:12px sans-serif; fill:#475569}
    .label{font:12px sans-serif; fill:#334155}
    .val{font:11px sans-serif; fill:#0f172a}
    .grid{stroke:#e2e8f0; stroke-width:1}
    .axis{stroke:#94a3b8; stroke-width:1}
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="34" class="title">Pharmacokinetic parameters (included run, geometric means)</text>
  <text x="30" y="54" class="sub">Source: 03-pharmacokinetic-modeling/results/population_summary.csv — error bars show 95% bootstrap CI</text>

  <!-- chart area -->
  <g transform="translate(70,80)">
    <!-- grid/axis for normalized-ish bars scaled individually; show values directly -->
    <line x1="0" y1="220" x2="780" y2="220" class="axis"/>
    <!-- bars: scale each to a max per-parameter visual for readability -->
    <!-- ka: mean 1.359 ci 0.898-2.230 (scale max 2.5) -->
    <g transform="translate(40,0)">
      <text x="40" y="245" text-anchor="middle" class="label">ka (1/h)</text>
      <rect x="20" y="100" width="40" height="120" fill="#2563eb" rx="4"/>
      <!-- ci whisker -->
      <line x1="40" y1="23" x2="40" y2="141" stroke="#0f172a" stroke-width="2"/>
      <line x1="32" y1="23" x2="48" y2="23" stroke="#0f172a" stroke-width="2"/>
      <line x1="32" y1="141" x2="48" y2="141" stroke="#0f172a" stroke-width="2"/>
      <text x="40" y="15" text-anchor="middle" class="val">1.36 [0.90, 2.23]</text>
    </g>
    <!-- ke: 0.088 [0.078,0.097] scale max 0.12 -->
    <g transform="translate(190,0)">
      <text x="40" y="245" text-anchor="middle" class="label">ke (1/h)</text>
      <rect x="20" y="59" width="40" height="161" fill="#0ea5e9" rx="4"/>
      <line x1="40" y1="42" x2="40" y2="77" stroke="#0f172a" stroke-width="2"/>
      <line x1="32" y1="42" x2="48" y2="42" stroke="#0f172a" stroke-width="2"/>
      <line x1="32" y1="77" x2="48" y2="77" stroke="#0f172a" stroke-width="2"/>
      <text x="40" y="34" text-anchor="middle" class="val">0.088 [0.078, 0.097]</text>
    </g>
    <!-- V/F: 0.454 [0.419,0.491] max 0.6 -->
    <g transform="translate(340,0)">
      <text x="40" y="245" text-anchor="middle" class="label">V/F (L/kg)</text>
      <rect x="20" y="54" width="40" height="166" fill="#10b981" rx="4"/>
      <line x1="40" y1="40" x2="40" y2="66" stroke="#0f172a" stroke-width="2"/>
      <line x1="32" y1="40" x2="48" y2="40" stroke="#0f172a" stroke-width="2"/>
      <line x1="32" y1="66" x2="48" y2="66" stroke="#0f172a" stroke-width="2"/>
      <text x="40" y="32" text-anchor="middle" class="val">0.454 [0.419, 0.491]</text>
    </g>
    <!-- CL/F: 0.040 [0.034,0.046] max 0.06 -->
    <g transform="translate(490,0)">
      <text x="40" y="245" text-anchor="middle" class="label">CL/F (L/h/kg)</text>
      <rect x="20" y="73" width="40" height="147" fill="#f59e0b" rx="4"/>
      <line x1="40" y1="51" x2="40" y2="95" stroke="#0f172a" stroke-width="2"/>
      <line x1="32" y1="51" x2="48" y2="51" stroke="#0f172a" stroke-width="2"/>
      <line x1="32" y1="95" x2="48" y2="95" stroke="#0f172a" stroke-width="2"/>
      <text x="40" y="43" text-anchor="middle" class="val">0.040 [0.034, 0.046]</text>
    </g>
    <!-- t1/2: 7.898 [7.165,8.904] max 10 -->
    <g transform="translate(640,0)">
      <text x="40" y="245" text-anchor="middle" class="label">t½ (h)</text>
      <rect x="20" y="46" width="40" height="174" fill="#8b5cf6" rx="4"/>
      <line x1="40" y1="24" x2="40" y2="62" stroke="#0f172a" stroke-width="2"/>
      <line x1="32" y1="24" x2="48" y2="24" stroke="#0f172a" stroke-width="2"/>
      <line x1="32" y1="62" x2="48" y2="62" stroke="#0f172a" stroke-width="2"/>
      <text x="40" y="16" text-anchor="middle" class="val">7.90 [7.17, 8.90]</text>
    </g>
  </g>
  <text x="30" y="340" class="sub">Note: bars are individually scaled for readability; numeric labels show actual included values and CIs.</text>
</svg>